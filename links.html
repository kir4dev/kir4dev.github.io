<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>prodkira</title>
    <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@300;500;600&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <style>
        @font-face {
            font-family: 'MainFont';
            src: url('font/main.ttf') format('truetype');
        }

        body {
            background-color: #000000;
            margin: 0;
            padding: 0;
        }

        .bigtop {
            color: white;
            font-family: 'MainFont', sans-serif;
            font-size: 4rem;
            text-align: center;
            width: 100%;
            margin: 0;
            padding: 40px 0 0 0;
        }

        .gradient-text {
            background: linear-gradient(90deg, #a855f7, #7c3aed);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: #555555;
            font-family: 'Raleway', sans-serif;
            font-weight: 300;
            font-size: 1.1rem;
            text-align: center;
            width: 100%;
            margin: 0;
            padding: 14px 0 0 0;
        }

        .cards {
            display: flex;
            justify-content: center;
            gap: 16px;
            padding: 60px 40px;
            flex-wrap: wrap;
            align-items: stretch;
        }

        .card-wrapper {
            perspective: 800px;
            display: flex;
        }

        .card {
            background-color: #000000;
            border: 1px solid #1c1c1c;
            border-radius: 20px;
            padding: 32px 24px;
            width: 210px;
            color: white;
            font-family: 'Raleway', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 12px;
            transform-style: preserve-3d;
            transition: transform 0.1s ease, border-color 0.3s, box-shadow 0.3s;
            will-change: transform;
            cursor: default;
            box-sizing: border-box;
        }

        .card:hover {
            border-color: #3a1a5a;
            box-shadow: 0 20px 60px rgba(120, 40, 200, 0.1);
        }

        .card i {
            font-size: 1.5rem;
            background: linear-gradient(135deg, #a855f7, #7c3aed);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .card-title {
            font-size: 1rem;
            font-weight: 600;
            color: #ffffff;
            letter-spacing: 0.02em;
        }

        .card-desc {
            font-size: 0.8rem;
            font-weight: 300;
            color: #444444;
            line-height: 1.6;
            flex: 1;
        }

        .card-btn {
            display: inline-block;
            margin-top: 8px;
            padding: 8px 20px;
            border-radius: 8px;
            background: #000000;
            border: 1px solid #222222;
            color: #888888;
            font-family: 'Raleway', sans-serif;
            font-weight: 500;
            font-size: 0.8rem;
            text-decoration: none;
            letter-spacing: 0.05em;
            transition: background 0.2s, border-color 0.2s, color 0.2s;
        }

        .card-btn:hover {
            background: #0a0010;
            border-color: #7c3aed;
            color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="bigtop">
        prod<span class="gradient-text">kira</span></div>

    <div class="subtitle">
        links
    </div>

    <div class="cards">
        <div class="card-wrapper">
            <div class="card">
                <i class="fa-solid fa-circle-play"></i>
                <div class="card-title">Movies (Aether)</div>
                <div class="card-desc">Best website for movies and TV shows. Make sure to turn ads off.</div>
                <a href="https://aether.mom/" class="card-btn">Open</a>
            </div>
        </div>
        <div class="card-wrapper">
            <div class="card">
                <i class="fa-solid fa-globe"></i>
                <div class="card-title">Pr⌀✕y</div>
                <div class="card-desc">Browse the web without the website getting blocked.</div>
                <a href="https://computer-sci.nanobit.org/" class="card-btn">Open</a>
            </div>
        </div>
        <div class="card-wrapper">
            <div class="card">
                <i class="fa-solid fa-music"></i>
                <div class="card-title">ProdPiracy</div>
                <div class="card-desc">LEGALLY BORROW VSTs and DAWs</div>
                <a href="schedule.html" class="card-btn">Open</a>
            </div>
        </div>
    </div>

    <script>
        document.querySelectorAll('.card').forEach(card => {
            card.addEventListener('mousemove', e => {
                const rect = card.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const cx = rect.width / 2;
                const cy = rect.height / 2;
                const rotateX = ((y - cy) / cy) * -12;
                const rotateY = ((x - cx) / cx) * 12;
                card.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale(1.04)`;
            });

            card.addEventListener('mouseleave', () => {
                card.style.transform = 'rotateX(0deg) rotateY(0deg) scale(1)';
                card.style.transition = 'transform 0.4s ease, border-color 0.3s, box-shadow 0.3s';
            });

            card.addEventListener('mouseenter', () => {
                card.style.transition = 'transform 0.1s ease, border-color 0.3s, box-shadow 0.3s';
            });
        });
    </script>

</body>
</html>
